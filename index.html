<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOTO-TETRİS V3 (PIXEL PERFECT & RETRO SFX)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
  :root {
    --nokia-bg: rgb(170, 192, 60);
    --nokia-fg: rgb(67, 82, 61);
    --nokia-dark: rgb(40, 50, 35);
    --panel-w: 140px;
    --cell: 30px;
    --cols: 12;
    --rows: 20;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--nokia-dark);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 100;
  }
  #shell { display: flex; gap: 0; border: 3px solid var(--nokia-fg); box-shadow: 0 0 40px rgba(67,82,61,0.6), inset 0 0 20px rgba(0,0,0,0.2); }
  #game-canvas { display: block; image-rendering: pixelated; }
  #panel {
    width: var(--panel-w); background: var(--nokia-bg);
    border-left: 2px solid var(--nokia-fg);
    display: flex; flex-direction: column; padding: 16px 10px; gap: 16px;
  }
  .panel-label { font-size: 13px; color: var(--nokia-fg); letter-spacing: 2px; opacity: 0.7; }
  .panel-value { font-size: 28px; color: var(--nokia-fg); line-height: 1; margin-top: 2px; }
  #next-canvas { display: block; margin-top: 4px; image-rendering: pixelated; }
  #upload-area {
    position: fixed; inset: 0; background: rgba(40,50,35,0.97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; gap: 20px;
  }
  #upload-area h1 { font-family: 'VT323', monospace; font-size: 52px; color: var(--nokia-bg); letter-spacing: 6px; text-shadow: 3px 3px 0 var(--nokia-fg); }
  #upload-area p  { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--nokia-fg); letter-spacing: 1px; opacity: 0.8; }
  #file-input { display: none; }
  .btn { font-family: 'VT323', monospace; font-size: 22px; letter-spacing: 3px; color: var(--nokia-dark); background: var(--nokia-bg); border: 2px solid var(--nokia-fg); padding: 8px 24px; cursor: pointer; transition: all 0.1s; }
  .btn:hover { background: var(--nokia-fg); color: var(--nokia-bg); }
  #demo-btn { font-size: 16px; opacity: 0.6; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: rgba(170,192,60,0.85); z-index: 10;
  }
  #overlay.visible { display: flex; }
  #overlay h2 { font-size: 48px; color: var(--nokia-fg); letter-spacing: 4px; }
  #overlay p  { font-size: 22px; color: var(--nokia-fg); opacity: 0.8; }
  #wrapper { position: relative; }
</style>
</head>
<body>

<div id="upload-area" style="display:none">
  <h1>FOTO-TETRİS</h1>
  <p>1–20 fotoğraf yükle, AI oynasın</p>
  <input type="file" id="file-input" multiple accept="image/*">
  <button class="btn" onclick="document.getElementById('file-input').click()">FOTOĞRAF YÜKLE</button>
  <button class="btn" id="demo-btn">DEMO (renk blokları)</button>
</div>

<div id="shell" style="display:none">
  <div id="wrapper">
    <canvas id="game-canvas"></canvas>
    <div id="overlay">
      <h2>GAME OVER</h2>
      <p>[R] yeniden başlat</p>
    </div>
  </div>
  <div id="panel">
    <div>
      <div class="panel-label">SCORE</div>
      <div class="panel-value" id="score-el">0</div>
    </div>
    <div>
      <div class="panel-label">NEXT</div>
      <canvas id="next-canvas" width="120" height="120"></canvas>
    </div>
  </div>
</div>

<script>
// ─── SABITLER ────────────────────────────────────────────────────────────────
const COLS = 12, ROWS = 20, CELL = 30;
const NOKIA_BG     = '#aac03c';
const NOKIA_BG_RGB = [170, 192, 60];
const NOKIA_FG_RGB = [ 67,  82, 61];
const BEYAZ_ESIK   = 240;

const BAYER4 = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5]
];

// Referanstaki kanıtlı ağırlıklar (temiz hücre ızgarasında uygulanır)
const AI_W = { height: 0.510066, lines: 0.760666, holes: 0.35663, bumpiness: 0.184483 };
// Taşı ne kadar aşağıya koyduğuna göre ödül (kuleye karşı sigorta)
const AI_LAND = 0.30;
// Hücre dolu sayılma eşiği (sütun bandı örnekleme oranı)
const CELL_FILL_RATIO = 0.30;

// (3x ve 1/3x kaldırıldı)
const SCALES = [0.5, 1, 2];

// Maksimum yüklenebilecek fotoğraf sayısı
const MAX_PHOTOS = 20;

// Sabit oyun hızı (eski slider'ın "5" konumuyla aynı)
const GAME_SPEED = 5;

// ─── SES MOTORU (KLASİK 8-BIT NES/GAMEBOY TETRİS SFX & MUSIC) ────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Ayrı ses kanalları: müzik ve efektler birbirini kesmesin
const masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9; masterGain.connect(audioCtx.destination);
const musicGain  = audioCtx.createGain(); musicGain.gain.value  = 1.0; musicGain.connect(masterGain);
const sfxGain    = audioCtx.createGain(); sfxGain.gain.value    = 1.0; sfxGain.connect(masterGain);

function play8BitTone(freq, duration, type = 'square', pitchDrop = false, delay = 0, volume = 0.08, bus = null) {
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  if (delay < 0) delay = 0;
  const startTime = audioCtx.currentTime + delay;

  osc.type = type; // 'square' veya 'triangle'
  osc.frequency.setValueAtTime(freq, startTime);

  if (pitchDrop) {
    osc.frequency.exponentialRampToValueAtTime(freq * 0.2, startTime + duration);
  }

  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + 0.004);
  gain.gain.setValueAtTime(volume, startTime + duration - 0.02);
  gain.gain.linearRampToValueAtTime(0.001, startTime + duration);

  osc.connect(gain);
  gain.connect(bus || masterGain);

  osc.start(startTime);
  osc.stop(startTime + duration);
}

const sfx = {
  land: () => {
    play8BitTone(120, 0.06, 'triangle', false, 0, 0.15, sfxGain);
  },
  clear: () => {
    play8BitTone(523.25, 0.08, 'square', false, 0.00, 0.08, sfxGain); // C5
    play8BitTone(659.25, 0.08, 'square', false, 0.06, 0.08, sfxGain); // E5
    play8BitTone(783.99, 0.08, 'square', false, 0.12, 0.08, sfxGain); // G5
    play8BitTone(1046.50, 0.20, 'square', false, 0.18, 0.08, sfxGain); // C6
  },
  hardDrop: () => {
    play8BitTone(800, 0.15, 'square', true, 0, 0.04, sfxGain);
  },
  rotate: () => {
    // kısa, net dönme blip'i (klasik Tetris hissi)
    play8BitTone(330, 0.035, 'square', false, 0,    0.06, sfxGain);
    play8BitTone(440, 0.035, 'square', false, 0.02, 0.05, sfxGain);
  },
  gameOver: () => {
    play8BitTone(392.00, 0.20, 'square', false, 0.0, 0.08, sfxGain); // G4
    play8BitTone(349.23, 0.20, 'square', false, 0.2, 0.08, sfxGain); // F4
    play8BitTone(329.63, 0.20, 'square', false, 0.4, 0.08, sfxGain); // E4
    play8BitTone(261.63, 0.70, 'square', true,  0.6, 0.08, sfxGain); // C4 (düşer)
  }
};

// ─── KLASİK TETRİS MÜZİĞİ (KOROBEINIKI) — MELODİ + BAS ───────────────────────
const nFreq = { A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880 };
const bgMelody = [
  {f: nFreq.E5, d: 2}, {f: nFreq.B4, d: 1}, {f: nFreq.C5, d: 1}, {f: nFreq.D5, d: 2}, {f: nFreq.C5, d: 1}, {f: nFreq.B4, d: 1},
  {f: nFreq.A4, d: 2}, {f: nFreq.A4, d: 1}, {f: nFreq.C5, d: 1}, {f: nFreq.E5, d: 2}, {f: nFreq.D5, d: 1}, {f: nFreq.C5, d: 1},
  {f: nFreq.B4, d: 3}, {f: nFreq.C5, d: 1}, {f: nFreq.D5, d: 2}, {f: nFreq.E5, d: 2},
  {f: nFreq.C5, d: 2}, {f: nFreq.A4, d: 2}, {f: nFreq.A4, d: 2}, {f: 0, d: 2},

  {f: nFreq.D5, d: 3}, {f: nFreq.F5, d: 1}, {f: nFreq.A5, d: 2}, {f: nFreq.G5, d: 1}, {f: nFreq.F5, d: 1},
  {f: nFreq.E5, d: 3}, {f: nFreq.C5, d: 1}, {f: nFreq.E5, d: 2}, {f: nFreq.D5, d: 1}, {f: nFreq.C5, d: 1},
  {f: nFreq.B4, d: 2}, {f: nFreq.B4, d: 1}, {f: nFreq.C5, d: 1}, {f: nFreq.D5, d: 2}, {f: nFreq.E5, d: 2},
  {f: nFreq.C5, d: 2}, {f: nFreq.A4, d: 2}, {f: nFreq.A4, d: 2}, {f: 0, d: 2}
];

// Bas hattı: melodi gibi toplam 64 vuruş → her döngüde melodiyle yeniden hizalanır
const nBass = { E2:82.41, A2:110.00, B2:123.47 };
const bassRoots = [
  nBass.E2, nBass.A2, nBass.B2, nBass.E2,   // 1. cümle (4 satır)
  nBass.A2, nBass.E2, nBass.B2, nBass.E2    // 2. cümle (4 satır)
];
const bgBass = [];
bassRoots.forEach(root => {
  const high = root * 2; // bir oktav üstü
  for (let i = 0; i < 4; i++) { bgBass.push({f: root, d: 1}); bgBass.push({f: high, d: 1}); }
});

const MUSIC_TEMPO = 150; // milisaniye (1 vuruş)

// ── Web Audio saat + AYRI TIMING WORKER + GENİŞ TAMPON ──────────────────────────
// Müziği ana thread'in HİÇBİR takılmasından etkilenmez kılmanın tek garantisi:
// her an Web Audio kuyruğunda büyük bir "önceden planlanmış" tampon tutmak. Ana
// thread X saniye donsa bile, tampon > X olduğu sürece ses kesintisiz çalar ve
// thread çözülünce tampon yeniden dolar. Worker tick'i + örnek-hassas zamanlama
// burada sadece tamponu beslemeye yarar. Tampon 1.2s → pratikteki tüm jank'ları
// (worker fallback, GC, render, spawn) yutar.
let isMusicPlaying = false;
let fallbackTimer  = null;
const LOOKAHEAD = 1.20;     // saniye: her an bu kadar müzik önceden kuyruğa atılır
const SCHED_INTERVAL = 50;  // ms (timing worker tick aralığı; tampon büyük olduğu için sık olması şart değil)
const melodyState = { idx: 0, next: 0 };
const bassState   = { idx: 0, next: 0 };

// Ayrı thread'de dönen saat; sadece "tick" mesajı atar, ana thread'i beklemez
let musicClockWorker = null;
function buildMusicClock() {
  const code =
    'var t=null;' +
    'onmessage=function(e){' +
      'if(e.data.type==="start"){clearInterval(t);t=setInterval(function(){postMessage(0);},e.data.ms);}' +
      'else if(e.data.type==="stop"){clearInterval(t);t=null;}' +
    '};';
  const blob = new Blob([code], { type: 'application/javascript' });
  const w = new Worker(URL.createObjectURL(blob));
  w.onmessage = () => { if (isMusicPlaying && !gameOver) scheduleMusic(); };
  return w;
}

function scheduleVoice(seq, state, volume, type, durMul) {
  while (state.next < audioCtx.currentTime + LOOKAHEAD) {
    const note = seq[state.idx];
    const dur = note.d * MUSIC_TEMPO / 1000;
    if (note.f !== 0) {
      const when = state.next - audioCtx.currentTime;
      play8BitTone(note.f, dur * durMul, type, false, when, volume, musicGain);
    }
    state.next += dur;
    state.idx = (state.idx + 1) % seq.length;
  }
}

function scheduleMusic() {
  scheduleVoice(bgMelody, melodyState, 0.026, 'square',   0.72); // melodi (staccato chip)
  scheduleVoice(bgBass,   bassState,   0.050, 'triangle', 0.85); // bas
}

function startMusic() {
  if (isMusicPlaying) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isMusicPlaying = true;
  // büyük tampon kullandığımız için kanalı baştan tam aç (önceki kısmayı iptal et)
  const now = audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(1.0, now);
  const t0 = now + 0.08;
  melodyState.idx = 0; melodyState.next = t0;
  bassState.idx   = 0; bassState.next   = t0;

  if (!musicClockWorker) {
    try { musicClockWorker = buildMusicClock(); }
    catch (err) { musicClockWorker = null; }
  }
  scheduleMusic(); // ilk bloğu hemen planla, ilk tick'i bekleme

  if (musicClockWorker) {
    musicClockWorker.postMessage({ type: 'start', ms: SCHED_INTERVAL });
  } else {
    // worker kurulamazsa ana thread fallback (yine de LOOKAHEAD geniş)
    clearInterval(fallbackTimer);
    fallbackTimer = setInterval(() => { if (isMusicPlaying && !gameOver) scheduleMusic(); }, SCHED_INTERVAL);
  }
}

function stopMusic() {
  isMusicPlaying = false;
  if (musicClockWorker) musicClockWorker.postMessage({ type: 'stop' });
  clearInterval(fallbackTimer); fallbackTimer = null;
  // Geniş tampon yüzünden kuyrukta bekleyen notaları anında sustur (sarkma olmasın)
  const now = audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(musicGain.gain.value, now);
  musicGain.gain.linearRampToValueAtTime(0.0001, now + 0.06);
}

// ─── PIXEL PERFECT GRID SİSTEMİ ──────────────────────────────────────────────
const PW = COLS * CELL;
const PH = ROWS * CELL;
let pixelGrid = new Uint8Array(PW * PH);
let solidGrid = new Uint8Array(PW * PH);

// Silinen satırların ÇÖKELTİSİ — SADECE görsel, çarpışmaya (solidGrid) hiç girmez.
// Satırlar yok olur ama bandın EN ALTINA ince bir çökelti bırakır. Yoğunluk değeri
// tutar (SED_MAX = en taze, 0 = yok); her taşta 1 azalıp yavaşça solar.
let sedimentGrid = new Uint8Array(PW * PH);
const SED_MAX = 6;
// bg(170,192,60) → koyu yeşil(120,140,58) arası, yoğunluğa göre kademeli renkler
const SED_COLORS = (() => {
  const bg = NOKIA_BG_RGB, dk = [120, 140, 58];
  const arr = [null]; // 0 = yok
  for (let i = 1; i <= SED_MAX; i++) {
    const t = i / SED_MAX;
    arr.push([
      Math.round(bg[0] + (dk[0] - bg[0]) * t),
      Math.round(bg[1] + (dk[1] - bg[1]) * t),
      Math.round(bg[2] + (dk[2] - bg[2]) * t)
    ]);
  }
  return arr;
})();

// Çökeltiyi yavaşça soldur (her taş yerleşmesinde bir kademe)
function fadeSediment() {
  for (let i = 0; i < sedimentGrid.length; i++) {
    if (sedimentGrid[i]) sedimentGrid[i]--;
  }
}

// Yok olan satır bandının EN ALTINA çökelti bırak (en alttaki 2 piksel-satır).
// Kaynak: silinen bandın dolu pikselleri; dither'la ~%37 yoğunlukta çökeltilir.
function depositSediment(removedYs) {
  let bottomY = -1;
  for (const y of removedYs) if (y > bottomY) bottomY = y;
  if (bottomY < 0) return;

  // bandın dolu olduğu sütunları topla (herhangi bir silinen satırda doluysa)
  const colFilled = new Uint8Array(PW);
  for (const y of removedYs) {
    const base = y * PW;
    for (let x = 0; x < PW; x++) if (solidGrid[base + x]) colFilled[x] = 1;
  }

  const rows = [bottomY, bottomY - 1]; // 2 piksel kalınlığında ince çökelti şeridi
  for (let k = 0; k < rows.length; k++) {
    const y = rows[k];
    if (y < 0) continue;
    const base = y * PW;
    for (let x = 0; x < PW; x++) {
      if (colFilled[x] && BAYER4[y & 3][x & 3] < 6) { // ~%37 dither → görünür ama hafif
        sedimentGrid[base + x] = SED_MAX;
      }
    }
  }
}

function clearGrids() {
  pixelGrid.fill(0);
  solidGrid.fill(0);
  sedimentGrid.fill(0);
}

function writeSolidMask(grid, px, py, solidMask, w_px, h_px, val) {
  for (let y = 0; y < h_px; y++) {
    const gy = py + y;
    if (gy < 0 || gy >= PH) continue;
    for (let x = 0; x < w_px; x++) {
      if (solidMask[y * w_px + x]) {
        const gx = px + x;
        if (gx >= 0 && gx < PW) grid[gy * PW + gx] = val;
      }
    }
  }
}

function isValid(px, py, solidMask, w_px, h_px) {
  for (let y = 0; y < h_px; y++) {
    const gy = py + y;
    for (let x = 0; x < w_px; x++) {
      if (solidMask[y * w_px + x]) {
        const gx = px + x;
        if (gx < 0 || gx >= PW) return false;
        if (gy >= PH) return false;
        if (gy >= 0 && solidGrid[gy * PW + gx]) return false;
      }
    }
  }
  return true;
}

function getDropY(px, start_py, solidMask, w_px, h_px) {
  let py = start_py;
  while (isValid(px, py + 1, solidMask, w_px, h_px)) {
    py++;
    if (py > PH) break;
  }
  return py;
}

// Yığının en üst (en küçük y) dolu pikseli; ışınlanma engeli için kullanılır
function stackTopY() {
  for (let y = 0; y < PH; y++) {
    const row = y * PW;
    for (let x = 0; x < PW; x++) {
      if (solidGrid[row + x]) return y;
    }
  }
  return PH;
}

let frameImageData = null;
function pixelGridToImageData() {
  if (!frameImageData) frameImageData = new ImageData(PW, PH);
  const d = frameImageData.data;
  const fg = NOKIA_FG_RGB, bg = NOKIA_BG_RGB;
  for (let i = 0; i < PW * PH; i++) {
    const o = i * 4;
    if (pixelGrid[i]) {
      d[o]=fg[0]; d[o+1]=fg[1]; d[o+2]=fg[2];
    } else if (sedimentGrid[i]) {
      const gc = SED_COLORS[sedimentGrid[i]];
      d[o]=gc[0]; d[o+1]=gc[1]; d[o+2]=gc[2];
    } else {
      d[o]=bg[0]; d[o+1]=bg[1]; d[o+2]=bg[2];
    }
    d[o+3]=255;
  }
  return frameImageData;
}

function clearFullPixelRows() {
  const removedYs = new Set();
  const threshold = PW * 0.70; // satır olması kolaylaştı (eskiden 0.85) — AI'a dokunmaz

  for (let y = 0; y < PH; y++) {
    let filled = 0;
    for (let x = 0; x < PW; x++) {
      if (solidGrid[y * PW + x]) filled++;
    }
    if (filled >= threshold) removedYs.add(y);
  }

  if (removedYs.size === 0) return 0;

  // Satırlar yok olacak AMA bandın en altına ince bir çökelti bırakacaklar.
  depositSediment(removedYs); // collapse'tan önce çağrılır (solidGrid hâlâ dolu)

  const keptVisual = [];
  const keptSolid = [];
  for (let y = 0; y < PH; y++) {
    if (!removedYs.has(y)) {
      keptVisual.push(pixelGrid.slice(y * PW, (y + 1) * PW));
      keptSolid.push(solidGrid.slice(y * PW, (y + 1) * PW));
    }
  }

  pixelGrid.fill(0);
  solidGrid.fill(0);

  const topPad = PH - keptVisual.length;
  for (let i = 0; i < keptVisual.length; i++) {
    pixelGrid.set(keptVisual[i], (topPad + i) * PW);
    solidGrid.set(keptSolid[i], (topPad + i) * PW);
  }
  return removedYs.size;
}

// ─── AI HEURISTICS (TEMIZ HÜCRE IZGARASI ÜZERINDE) ───────────────────────────
// Piksel dünyasını 12x20 temiz bir hücre ızgarasına indirger; böylece blob'ların
// kendi kıvrımları "delik/yükseklik" gürültüsü üretmez ve referanstaki kanıtlı
// ağırlıklar düzgün çalışır (kule saplantısı biter). Yerleştirme/çarpışma yine
// piksel-hassas kalır (aşağıdaki aiBest'te isValid/getDropY).
function buildCellGrid() {
  const cg = new Uint8Array(COLS * ROWS);
  const samplesPerSide = Math.floor(CELL / 2);           // 15
  const need = (samplesPerSide * samplesPerSide) * CELL_FILL_RATIO;
  for (let r = 0; r < ROWS; r++) {
    const y0 = r * CELL;
    for (let c = 0; c < COLS; c++) {
      const x0 = c * CELL;
      let cnt = 0;
      for (let y = 0; y < CELL; y += 2) {
        const row = (y0 + y) * PW + x0;
        for (let x = 0; x < CELL; x += 2) {
          if (solidGrid[row + x]) cnt++;
        }
      }
      cg[r * COLS + c] = (cnt >= need) ? 1 : 0;
    }
  }
  return cg;
}

function evaluateCellGrid() {
  const cg = buildCellGrid();
  const colH = new Array(COLS).fill(0);
  let holes = 0;

  for (let c = 0; c < COLS; c++) {
    let seen = false;
    for (let r = 0; r < ROWS; r++) {
      const occ = cg[r * COLS + c];
      if (occ) {
        if (!seen) { seen = true; colH[c] = ROWS - r; }
      } else if (seen) {
        holes++;
      }
    }
  }

  let aggH = 0, bump = 0;
  for (let c = 0; c < COLS; c++) aggH += colH[c];
  for (let c = 0; c < COLS - 1; c++) bump += Math.abs(colH[c] - colH[c + 1]);

  let lines = 0;
  for (let r = 0; r < ROWS; r++) {
    let full = true;
    for (let c = 0; c < COLS; c++) { if (!cg[r * COLS + c]) { full = false; break; } }
    if (full) lines++;
  }

  return - AI_W.height * aggH
         + AI_W.lines * lines
         - AI_W.holes * holes
         - AI_W.bumpiness * bump;
}

function aiBest(pieceIdx, scaleIdx) {
  let best = null, bestScore = -Infinity;
  for (let rot = 0; rot < 4; rot++) {
    const pd = pieceData[pieceIdx][scaleIdx][rot];
    for (let col = -1; col <= COLS; col++) {
      const px = col * CELL;
      const start_py = -pd.h_px;

      if (!isValid(px, start_py, pd.solidMask, pd.w_px, pd.h_px)) continue;

      const py = getDropY(px, start_py, pd.solidMask, pd.w_px, pd.h_px);
      if (py < -pd.h_px + 1) continue;

      writeSolidMask(solidGrid, px, py, pd.solidMask, pd.w_px, pd.h_px, 1);
      let score = evaluateCellGrid();
      writeSolidMask(solidGrid, px, py, pd.solidMask, pd.w_px, pd.h_px, 0);

      // Düşük yere koymayı ödüllendir (taşın alt kenarı ne kadar aşağıdaysa o kadar iyi)
      score += AI_LAND * ((py + pd.h_px) / CELL);

      if (score > bestScore) {
        bestScore = score;
        best = { rot, col, px, py };
      }
    }
  }
  return best;
}

// ─── DITHERING VE MASKELAMA ──────────────────────────────────────────────────
function buildFgMask(imageData, w, h) {
  const src  = imageData.data;
  const mask = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = src[i], g = src[i+1], b = src[i+2], a = src[i+3];
      const isWhite = (a < 128) || (r >= BEYAZ_ESIK && g >= BEYAZ_ESIK && b >= BEYAZ_ESIK);
      const luma = 0.299*r + 0.587*g + 0.114*b;
      const threshold = BAYER4[y % 4][x % 4] / 16.0 * 255.0;
      mask[y * w + x] = (!isWhite && luma < threshold) ? 1 : 0;
    }
  }
  return mask;
}

function buildSolidMask(ctx, w_px, h_px) {
  const imgData = ctx.getImageData(0, 0, w_px, h_px).data;
  const outside = new Uint8Array(w_px * h_px);
  const q = [];

  const isTransOrWhite = (idx) => {
    const r = imgData[idx*4], g = imgData[idx*4+1], b = imgData[idx*4+2], a = imgData[idx*4+3];
    return a < 128 || (r >= BEYAZ_ESIK && g >= BEYAZ_ESIK && b >= BEYAZ_ESIK);
  };

  for(let y=0; y<h_px; y++) {
    if (isTransOrWhite(y*w_px + 0)) { q.push(0, y); outside[y*w_px + 0] = 1; }
    if (isTransOrWhite(y*w_px + w_px-1)) { q.push(w_px-1, y); outside[y*w_px + w_px-1] = 1; }
  }
  for(let x=0; x<w_px; x++) {
    if (isTransOrWhite(0*w_px + x)) { q.push(x, 0); outside[0*w_px + x] = 1; }
    if (isTransOrWhite((h_px-1)*w_px + x)) { q.push(x, h_px-1); outside[(h_px-1)*w_px + x] = 1; }
  }

  let head = 0;
  while(head < q.length) {
    const x = q[head++];
    const y = q[head++];
    const neighbors = [[x-1, y], [x+1, y], [x, y-1], [x, y+1]];
    for(let i=0; i<4; i++) {
      const nx = neighbors[i][0];
      const ny = neighbors[i][1];
      if (nx>=0 && nx<w_px && ny>=0 && ny<h_px) {
        const idx = ny * w_px + nx;
        if (!outside[idx] && isTransOrWhite(idx)) {
          outside[idx] = 1;
          q.push(nx, ny);
        }
      }
    }
  }

  const solidMask = new Uint8Array(w_px * h_px);
  for (let i = 0; i < w_px * h_px; i++) solidMask[i] = outside[i] ? 0 : 1;
  return solidMask;
}

function maskToCanvas(mask, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const id = ctx.createImageData(w, h);
  const d = id.data;
  for (let i = 0; i < w * h; i++) {
    const col = mask[i] ? NOKIA_FG_RGB : NOKIA_BG_RGB;
    d[i*4]=col[0]; d[i*4+1]=col[1]; d[i*4+2]=col[2]; d[i*4+3]=255;
  }
  ctx.putImageData(id, 0, 0);
  return c;
}

// ─── FOTOĞRAF / DITHERING KURULUMU ───────────────────────────────────────────
let photos          = [];
let pieceData       = [];
let previewCanvases = [];
let maxPrevW = 60, maxPrevH = 60;

function setupPhotos(imgs) {
  photos = imgs; pieceData = []; previewCanvases = [];
  maxPrevW = 0; maxPrevH = 0;

  for (const img of imgs) {
    const iw = img.naturalWidth  || img.width  || 60;
    const ih = img.naturalHeight || img.height || 120;
    const baseW_px = 60;
    const baseH_px = 60 * (ih / iw);

    const scalesData = [];
    const scalesPreviews = [];

    for (const scale of SCALES) {
      const targetW_px = baseW_px * scale;
      const targetH_px = baseH_px * scale;
      const cw = Math.max(1, Math.round(targetW_px / CELL));
      const ch = Math.max(1, Math.round(targetH_px / CELL));
      const pw = cw * CELL;
      const ph = ch * CELL;

      const fitC = document.createElement('canvas');
      fitC.width = pw; fitC.height = ph;
      const fitCtx = fitC.getContext('2d');
      const drawScale = Math.min(pw / iw, ph / ih);
      const dw = iw * drawScale;
      const dh = ih * drawScale;
      fitCtx.drawImage(img, (pw - dw) / 2, (ph - dh) / 2, dw, dh);

      const rotData = [];
      for (let rot = 0; rot < 4; rot++) {
        const angle = rot * 90;
        const isFlipped = rot % 2 === 1;
        const rw = isFlipped ? ph : pw;
        const rh = isFlipped ? pw : ph;

        const rotC = document.createElement('canvas');
        rotC.width = rw; rotC.height = rh;
        const rotCtx = rotC.getContext('2d', { willReadFrequently: true });
        rotCtx.save();
        rotCtx.translate(rw/2, rh/2);
        rotCtx.rotate(angle * Math.PI / 180);
        rotCtx.drawImage(fitC, -pw/2, -ph/2);
        rotCtx.restore();

        const solidMask = buildSolidMask(rotCtx, rw, rh);

        const finalC = document.createElement('canvas');
        finalC.width = rw; finalC.height = rh;
        const finalCtx = finalC.getContext('2d', { willReadFrequently: true });
        finalCtx.fillStyle = '#ffffff';
        finalCtx.fillRect(0, 0, rw, rh);
        finalCtx.drawImage(rotC, 0, 0);

        const idRaw = finalCtx.getImageData(0, 0, rw, rh);
        const mask = buildFgMask(idRaw, rw, rh);

        rotData.push({ cw: (isFlipped ? ch : cw), ch: (isFlipped ? cw : ch), w_px: rw, h_px: rh, mask, solidMask });
      }
      scalesData.push(rotData);
      const prev = maskToCanvas(rotData[0].mask, pw, ph);
      scalesPreviews.push(prev);
      if (prev.width  > maxPrevW) maxPrevW = prev.width;
      if (prev.height > maxPrevH) maxPrevH = prev.height;
    }
    pieceData.push(scalesData);
    previewCanvases.push(scalesPreviews);
  }
}

// Worker'a gönderilecek hafif kopya (sadece solidMask + boyutlar)
function serializePieceData() {
  return pieceData.map(scales => scales.map(rots => rots.map(pd => ({
    cw: pd.cw, ch: pd.ch, w_px: pd.w_px, h_px: pd.h_px, solidMask: pd.solidMask
  }))));
}

// ─── AI WORKER (ana thread'i kilitlemez → müzik kesilmez) ────────────────────
let aiWorker = null;

function buildAiWorker() {
  try {
    const fns = [writeSolidMask, isValid, getDropY, buildCellGrid, evaluateCellGrid, aiBest]
      .map(f => f.toString()).join('\n');
    const workerCode =
      'let PW,PH,COLS,ROWS,CELL,AI_W,AI_LAND,CELL_FILL_RATIO,pieceData,solidGrid;\n' +
      fns + '\n' +
      'onmessage = function(e){\n' +
      '  var m = e.data;\n' +
      '  if(m.type==="init"){\n' +
      '    PW=m.PW;PH=m.PH;COLS=m.COLS;ROWS=m.ROWS;CELL=m.CELL;AI_W=m.AI_W;AI_LAND=m.AI_LAND;CELL_FILL_RATIO=m.CELL_FILL_RATIO;pieceData=m.pieceData;\n' +
      '    return;\n' +
      '  }\n' +
      '  if(m.type==="best"){\n' +
      '    solidGrid = new Uint8Array(m.grid);\n' +
      '    var best = aiBest(m.pieceIdx, m.scaleIdx);\n' +
      '    postMessage({type:"best", reqId:m.reqId, best:best});\n' +
      '  }\n' +
      '};\n';
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const w = new Worker(URL.createObjectURL(blob));
    w.onmessage = (e) => { const d = e.data; if (d.type === 'best') onBestReady(d.reqId, d.best); };
    w.onerror = () => { aiWorker = null; };
    return w;
  } catch (err) {
    return null;
  }
}

function initAi() {
  aiWorker = buildAiWorker();
  if (aiWorker) {
    aiWorker.postMessage({
      type: 'init',
      PW, PH, COLS, ROWS, CELL, AI_W, AI_LAND, CELL_FILL_RATIO,
      pieceData: serializePieceData()
    });
  }
}

// ─── OYUN DURUMU ─────────────────────────────────────────────────────────────
const gameCanvas  = document.getElementById('game-canvas');
const gCtx        = gameCanvas.getContext('2d');
const nextCanvas  = document.getElementById('next-canvas');
const nCtx        = nextCanvas.getContext('2d');
const scoreEl     = document.getElementById('score-el');
const overlay     = document.getElementById('overlay');
const panel       = document.getElementById('panel');

let activePiece, nextPieceIdx, nextScaleIdx, score, totalLines, gameOver, totalClearedPixels;
let animFrame = null, stateTimer = null;
let durum = 'bos', bestTarget = null;
let vizX = 0, vizY = 0;
let hedefX = 0, hedefRot = 0;
let aramaAdim = 0, aramaMaks = 3;
let lastT = null;
let curStackTop = PH;

// Asenkron AI istek yönetimi
let bestReqId = 0;
let lastHandledReq = -1;
let reqWatchdog = null;
let spawnIdx = 0, spawnScale = 0;

function normalHz()   { return Math.max(30, 400 - (GAME_SPEED - 1) * 35); }
function harddropHz() { return Math.max(8,  normalHz() / 5); }

// ─── GLOBAL HIZ ÖLÇEĞİ (madde 5: oyunu ~%30 yavaşlat) ───────────────────────
const SPEED_MUL = 0.70;          // tüm hareket hızları bununla çarpılır
const TIMER_MUL = 1 / SPEED_MUL; // düşünme/arama/bekleme zamanlayıcıları bununla uzar (~1.43×)

// Konumlanma fazında taşı yığının üstünde tut (ışınlanma engeli)
function clampAboveStack() {
  if (!activePiece) return;
  const pd = pieceData[activePiece.pieceIdx][activePiece.scaleIdx][activePiece.rot];
  const safe = curStackTop - pd.h_px - 4;
  if (vizY > safe) vizY = safe;
}

// ─── OYUN FONKSIYONLARI ───────────────────────────────────────────────────────
function startGame() {
  score = 0; totalLines = 0; gameOver = false; totalClearedPixels = 0;
  durum = 'bos'; activePiece = null; bestTarget = null; lastT = null;
  curStackTop = PH;
  bestReqId++;                 // bekleyen eski istekleri geçersiz kıl
  clearTimeout(reqWatchdog); reqWatchdog = null;
  overlay.classList.remove('visible');
  scoreEl.textContent = '0';
  cancelAnimationFrame(animFrame); clearTimeout(stateTimer);
  clearGrids();
  nextPieceIdx = Math.floor(Math.random() * photos.length);
  nextScaleIdx = Math.floor(Math.random() * SCALES.length);

  startMusic();
  spawnPiece();
}

// Yeni taş: AI'dan en iyi yeri ASENKRON iste (worker varsa worker'da hesaplanır)
function spawnPiece() {
  if (gameOver) return;
  const idx = nextPieceIdx, scaleIdx = nextScaleIdx;

  nextPieceIdx = Math.floor(Math.random() * photos.length);
  nextScaleIdx = Math.floor(Math.random() * SCALES.length);
  drawNext();

  spawnIdx = idx; spawnScale = scaleIdx;
  bestReqId++;
  bestTarget = null;
  durum = 'bekliyor';
  requestBest(bestReqId, idx, scaleIdx);
}

function requestBest(reqId, idx, scaleIdx) {
  if (aiWorker) {
    const copy = solidGrid.slice();
    aiWorker.postMessage({ type: 'best', reqId, pieceIdx: idx, scaleIdx, grid: copy.buffer }, [copy.buffer]);
    clearTimeout(reqWatchdog);
    reqWatchdog = setTimeout(() => {
      if (reqId !== bestReqId) return;
      onBestReady(reqId, aiBest(idx, scaleIdx)); // worker yanıt vermezse ana thread fallback
    }, 700);
  } else {
    onBestReady(reqId, aiBest(idx, scaleIdx));
  }
}

function onBestReady(reqId, best) {
  if (reqId !== bestReqId) return;     // eski/geçersiz istek
  if (reqId === lastHandledReq) return; // çift işleme engeli (worker + watchdog)
  lastHandledReq = reqId;
  clearTimeout(reqWatchdog); reqWatchdog = null;
  if (gameOver) return;
  if (!best) { endGame(); return; }
  beginPieceFlight(best);
}

function beginPieceFlight(best) {
  bestTarget = best;
  const idx = spawnIdx, scaleIdx = spawnScale;
  const startRot = 0; // NEXT önizlemesiyle birebir aynı yön
  const pd = pieceData[idx][scaleIdx][startRot];
  const startCol = Math.floor(Math.random() * Math.max(1, COLS - pd.cw));
  const startRow = -pd.h_px;

  activePiece = { pieceIdx: idx, scaleIdx: scaleIdx, rot: startRot, px: startCol * CELL, py: startRow };
  vizX = activePiece.px;
  vizY = activePiece.py;
  durum = 'dusunuyor';
  curStackTop = stackTopY(); // bu taş uçarken yığın değişmez

  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    // madde 6: daha çok arama adımı (eskiden 2-4) → 3-5
    durum = 'araniyor'; aramaAdim = 0; aramaMaks = 3 + Math.floor(Math.random() * 3);
    aramaStep();
  }, (500 + Math.random() * 250) * TIMER_MUL); // madde 6: daha uzun ilk düşünme + madde 5 yavaşlatma

  cancelAnimationFrame(animFrame);
  animFrame = null; lastT = null;
  animFrame = requestAnimationFrame(gameLoop);
}

function aramaStep() {
  if (gameOver || durum !== 'araniyor') return;
  const pd = pieceData[activePiece.pieceIdx][activePiece.scaleIdx][activePiece.rot];
  if (aramaAdim >= aramaMaks) {
    durum = 'hareket'; hedefX = bestTarget.px; hedefRot = bestTarget.rot; return;
  }
  aramaAdim++;
  const kayma = (Math.random() < 0.5 ? -1 : 1) * CELL * (1 + Math.floor(Math.random() * 2));
  vizX = Math.max(0, Math.min(PW - pd.w_px, vizX + kayma));
  if (Math.random() < 0.55) {           // madde 6: daha sık döndürme
    activePiece.rot = (activePiece.rot + 1) % 4;
    sfx.rotate();                        // madde 2: döndürme sesi
  }
  clearTimeout(stateTimer);
  stateTimer = setTimeout(aramaStep, (200 + Math.random() * 150) * TIMER_MUL); // madde 5
}

function gameLoop(t) {
  if (gameOver) return;
  const dt = lastT ? Math.min(t - lastT, 50) : 16;
  lastT = t;
  const sdt = dt * SPEED_MUL; // madde 5: tüm hareketler %30 yavaş

  if (durum === 'dusunuyor') {
    vizY += (CELL / normalHz()) * sdt * 0.5;
    clampAboveStack();
  } else if (durum === 'araniyor') {
    vizY += (CELL / normalHz()) * sdt * 0.7;
    clampAboveStack();
  } else if (durum === 'hareket') {
    activePiece.rot = hedefRot;

    const dx   = hedefX - vizX;
    const adim = Math.sign(dx) * Math.min(Math.abs(dx), (CELL * 2 / normalHz()) * sdt * 10);
    vizX += adim;
    vizY += (CELL / normalHz()) * sdt * 2;
    clampAboveStack(); // yatay hizalanırken taş yığının üstünde kalsın (ışınlanma yok)

    if (Math.abs(vizX - hedefX) < 1) {
      vizX = hedefX;
      if (durum !== 'harddrop') {
        durum = 'harddrop';
        sfx.hardDrop();
      }
    }
  } else if (durum === 'harddrop') {
    // vizX sabit (hedefX = bestTarget.px); sadece düz aşağı in → araya giremez
    const hedefY = bestTarget.py;
    vizY += (CELL / harddropHz()) * sdt * 6;
    if (vizY >= hedefY) {
      vizY = hedefY;
      activePiece.px = bestTarget.px;
      activePiece.py = bestTarget.py;
      durum = 'bos';
      draw();
      landPiece();
      return;
    }
  }
  draw();
  animFrame = requestAnimationFrame(gameLoop);
}

function landPiece() {
  const pd = pieceData[activePiece.pieceIdx][activePiece.scaleIdx][activePiece.rot];

  fadeSediment(); // önceki çökeltileri bir kademe soldur

  writeSolidMask(pixelGrid, activePiece.px, activePiece.py, pd.mask, pd.w_px, pd.h_px, 1);
  writeSolidMask(solidGrid, activePiece.px, activePiece.py, pd.solidMask, pd.w_px, pd.h_px, 1);

  const clearedPixels = clearFullPixelRows();

  if (clearedPixels > 0) {
    sfx.clear();
    totalClearedPixels += clearedPixels;
    totalLines = Math.floor(totalClearedPixels / CELL);
    score += clearedPixels * 4;
    scoreEl.textContent = score;
  } else {
    sfx.land();
  }

  curStackTop = stackTopY();

  // Bitiş: yığın üst satıra ulaştıysa oyun aynı turda biter
  if (curStackTop < CELL) {
    endGame(); return;
  }

  draw(); animFrame = null; lastT = null;
  setTimeout(spawnPiece, 80 * TIMER_MUL);
}

function endGame() {
  gameOver = true;
  stopMusic();
  sfx.gameOver();
  clearTimeout(stateTimer); cancelAnimationFrame(animFrame);
  clearTimeout(reqWatchdog); reqWatchdog = null;
  bestReqId++; // bekleyen yanıtları geçersiz kıl
  animFrame = null; overlay.classList.add('visible'); draw();
}

// ─── ÇİZİM ───────────────────────────────────────────────────────────────────
function draw() {
  const id = pixelGridToImageData();

  if (activePiece && !gameOver && durum !== 'bos' && durum !== 'bekliyor') {
    const pd   = pieceData[activePiece.pieceIdx][activePiece.scaleIdx][activePiece.rot];
    const mask = pd.mask;
    const pw   = pd.w_px;
    const ph   = pd.h_px;
    const ox   = Math.round(vizX);
    const oy   = Math.round(vizY);
    const d    = id.data;
    const fg   = NOKIA_FG_RGB;

    for (let my = 0; my < ph; my++) {
      const gy = oy + my;
      if (gy < 0 || gy >= PH) continue;
      for (let mx = 0; mx < pw; mx++) {
        if (!mask[my * pw + mx]) continue;
        const gx = ox + mx;
        if (gx < 0 || gx >= PW) continue;
        const pi = (gy * PW + gx) * 4;
        d[pi]=fg[0]; d[pi+1]=fg[1]; d[pi+2]=fg[2]; d[pi+3]=255;
      }
    }
  }
  gCtx.putImageData(id, 0, 0);
}

function drawNext() {
  nCtx.imageSmoothingEnabled = false;
  nCtx.fillStyle = NOKIA_BG;
  nCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (nextPieceIdx == null) return;

  const src = previewCanvases[nextPieceIdx][nextScaleIdx];
  // 1:1, ölçeksiz çiz → sahnedeki taşla birebir aynı
  const x = (nextCanvas.width  - src.width)  >> 1;
  const y = (nextCanvas.height - src.height) >> 1;
  nCtx.drawImage(src, x, y);
}

document.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && photos.length > 0) startGame();
});

document.getElementById('file-input').addEventListener('change', function(e) {
  let files = Array.from(e.target.files);
  if (!files.length) return;
  if (files.length > MAX_PHOTOS) files = files.slice(0, MAX_PHOTOS);
  const imgs = []; let loaded = 0;
  files.forEach(file => {
    const img = new Image();
    img.onload = () => { imgs.push(img); if (++loaded === files.length) launch(imgs); };
    img.src = URL.createObjectURL(file);
  });
});

document.getElementById('demo-btn').addEventListener('click', () => {
  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];
  const imgs = colors.map(col => {
    const c = document.createElement('canvas');
    c.width = 60; c.height = 90;
    const ctx = c.getContext('2d');
    ctx.fillStyle = col; ctx.fillRect(0, 0, 60, 90);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(10, 10, 40, 70);
    const img = new Image(); img.src = c.toDataURL(); return img;
  });
  let loaded = 0;
  imgs.forEach(img => {
    if (img.complete) { if (++loaded === imgs.length) launch(imgs); }
    else img.onload = () => { if (++loaded === imgs.length) launch(imgs); };
  });
});

// ─── REPODAKİ FOTOLARI OTOMATİK YÜKLE (1..100, hangisi varsa) ───────────────
(function autoStart() {
  const BASE = '';   // fotolar bir alt klasördeyse burayı 'photos/' yap
  const EXTS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG', 'WEBP'];
  const MAX  = 100;
  const slots = new Array(MAX + 1).fill(null);
  let settled = 0;

  function done() {
    if (++settled < MAX) return;
    const imgs = slots.filter(Boolean);   // sayı sırasında, sadece bulunanlar
    if (imgs.length === 0) {
      document.body.innerHTML =
        '<p style="color:#3a4a23;font-family:monospace;padding:40px">' +
        'Fotoğraf bulunamadı. Dosyaları 1.jpg, 2.jpg ... olarak repoya koyun.</p>';
      return;
    }
    launch(imgs);
  }

  for (let n = 1; n <= MAX; n++) {
    (function (num) {
      let e = 0;
      const img = new Image();
      img.onload  = () => { slots[num] = img; done(); };
      img.onerror = () => {
        if (++e < EXTS.length) img.src = BASE + num + '.' + EXTS[e];
        else done();   // bu numara yok, atla
      };
      img.src = BASE + num + '.' + EXTS[0];
    })(n);
  }
})();

function launch(imgs) {
  setupPhotos(imgs);

  // NEXT kutusunu en büyük taşı (rot-0, 2x) ham boyutta gösterecek şekilde ayarla → 1:1
  const padN = 12;
  nextCanvas.width  = maxPrevW + padN;
  nextCanvas.height = maxPrevH + padN;
  panel.style.width = Math.max(140, maxPrevW + padN + 20) + 'px';

  initAi(); // AI worker'ı bir kez kur

  gameCanvas.width  = PW;
  gameCanvas.height = PH;
  document.getElementById('upload-area').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  startGame();
}
</script>
